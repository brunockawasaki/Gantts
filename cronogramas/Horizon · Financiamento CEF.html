<!doctype html>
<meta charset="utf-8">
<title>Horizon · Financiamento CEF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
/* Layout igual ao do Comercial: uma faixa por etapa, barras entre marcos, cartões e tabelas. */
:root{
  --surface:#fcfcfb; --plane:#f4f3ef; --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --rule:#c3c2b7;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --crit:#c8372d; --hoje:#e08a00;
  --font-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --surface:#1a1a19; --plane:#0d0d0d; --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --rule:#383835;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --crit:#ff6a5c; --hoje:#ffb23a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --surface:#1a1a19; --plane:#0d0d0d; --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --rule:#383835;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --crit:#ff6a5c; --hoje:#ffb23a;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--plane);color:var(--ink);font-family:var(--font-body);margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:32px 56px;display:flex;flex-direction:column;gap:26px}

/* cabeçalho */
.eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
h1{font-family:var(--font-display);font-weight:800;font-size:clamp(28px,4.6vw,44px);line-height:1.02;letter-spacing:-.022em;margin:0;text-wrap:balance}
.sub{color:var(--ink-2);font-size:15px;line-height:1.55;margin:10px 0 0;max-width:68ch}
.meta{display:flex;flex-wrap:wrap;gap:8px 28px;margin:18px 0 0;padding-top:16px;border-top:1px solid var(--grid)}
.meta div{display:flex;flex-direction:column;gap:2px}
.meta dt{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.meta dd{margin:0;font-family:var(--font-display);font-weight:600;font-size:19px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.meta dd.alerta{color:var(--crit)}

/* legenda */
.key{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.key span{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-2);font-weight:500;white-space:nowrap}
.key i{width:11px;height:11px;border-radius:3px;flex:none;display:inline-block}
.k-done{background:var(--s3)}
.k-doing{background:linear-gradient(to right,var(--s1) 50%,color-mix(in srgb,var(--s1) 28%,var(--surface)) 50%)}
.k-todo{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--s1) 8%,var(--surface)) 0 3px,color-mix(in srgb,var(--s1) 26%,var(--surface)) 3px 6px);box-shadow:inset 0 0 0 1px var(--s1)}
.k-ideal{background:var(--muted);opacity:.7}
.k-crit{background:transparent;box-shadow:0 0 0 2px var(--crit)}
.k-gap{background:repeating-linear-gradient(135deg,var(--crit) 0 3px,transparent 3px 6px)}

/* gráfico */
.chart{background:var(--surface);border:1px solid var(--grid);border-radius:10px;padding:26px 18px 14px;overflow-x:auto}
.plot{min-width:820px;position:relative}
.plot-body{position:relative;display:flex;flex-direction:column;gap:4px}
.lane{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center;padding:6px 0;border-top:1px solid var(--grid)}
.lane:first-child{border-top:0}
.lane-name{font-family:var(--font-display);font-weight:600;font-size:12.5px;letter-spacing:-.005em;text-align:right;color:var(--ink);min-width:0}
.lane-name b{display:block;font-family:var(--font-mono);font-weight:400;font-size:10px;color:var(--muted);letter-spacing:.03em;margin-top:2px}
.lane-name b.mais{color:var(--crit);font-weight:600}
.labels{position:relative;height:30px;pointer-events:none}
.mlabel{position:absolute;white-space:nowrap;font-family:var(--font-mono);font-size:10px;font-weight:500;color:var(--ink-2);background:var(--surface);padding:0 3px;border-radius:2px}
.mlabel.lvl0{bottom:2px}
.mlabel.lvl1{bottom:16px}
.mlabel.ini{transform:none}
.mlabel.mid{transform:translateX(-50%)}
.mlabel.fim{transform:translateX(-100%)}
.track{position:relative;height:40px}
.seg{position:absolute;top:6px;height:14px;border-radius:2px;box-shadow:0 0 0 2px var(--surface);cursor:default;transition:filter .12s}
.seg.done{background:var(--s3)}
.seg.doing{background:linear-gradient(to right,var(--s1) var(--p),color-mix(in srgb,var(--s1) 28%,var(--surface)) var(--p))}
.seg.todo{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--s1) 8%,var(--surface)) 0 6px,color-mix(in srgb,var(--s1) 26%,var(--surface)) 6px 12px);box-shadow:inset 0 0 0 1.5px var(--s1),0 0 0 2px var(--surface)}
.seg.crit{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--crit)}
.seg.todo.crit{box-shadow:inset 0 0 0 1.5px var(--s1),0 0 0 2px var(--surface),0 0 0 3.5px var(--crit)}
.seg.ideal{top:27px;height:7px;background:var(--muted);opacity:.7}
.seg.gap{top:11px;height:6px;background:repeating-linear-gradient(135deg,var(--crit) 0 3px,transparent 3px 6px);box-shadow:none}
.seg:hover{filter:saturate(1.2) brightness(1.05)}
.dot{position:absolute;top:13px;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;background:var(--s1);border-radius:2px;transform:rotate(45deg);box-shadow:0 0 0 2px var(--surface);cursor:default;z-index:2;transition:transform .12s}
.dot.done{background:var(--s3)}
.dot.crit{background:var(--crit)}
.dot.ideal{top:30.5px;background:var(--muted)}
.dot:hover{transform:rotate(45deg) scale(1.35)}
.ilabel{position:absolute;top:25px;margin-left:7px;font-family:var(--font-mono);font-size:10px;color:var(--muted);white-space:nowrap;pointer-events:none}
.lane:hover .seg{filter:saturate(1.15)}

/* régua e linhas */
.ruler-row{display:grid;grid-template-columns:150px 1fr;gap:14px}
.ruler{position:relative;height:24px;border-top:1px solid var(--rule);margin-top:6px}
.tick{position:absolute;top:0;transform:translateX(-50%);font-family:var(--font-mono);font-size:10px;color:var(--muted);padding-top:5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tick::before{content:"";position:absolute;top:0;left:50%;width:1px;height:4px;background:var(--rule)}
.tick.borda-ini{transform:none}.tick.borda-ini::before{left:0}
.overlay{position:absolute;inset:0;margin-left:164px;pointer-events:none}
.gridline{position:absolute;top:0;bottom:0;width:1px;background:var(--grid)}
.vline{position:absolute;top:0;bottom:0;width:0}
.vline.hoje{border-left:2px solid var(--hoje)}
.vline.ideal{border-left:1.5px dashed var(--muted);opacity:.8}
.vtag{position:absolute;top:-17px;transform:translateX(-50%);font-family:var(--font-mono);font-size:9.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;padding:0 4px;background:var(--surface);border-radius:2px}
.vtag.hoje{color:var(--hoje)}
.vtag.ideal{color:var(--muted)}

/* cartões */
.nodes{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:14px}
.node{background:var(--surface);border:1px solid var(--grid);border-left:3px solid var(--muted);border-radius:8px;padding:14px 16px}
.node.c{border-left-color:var(--crit)}
.node.a{border-left-color:var(--s4)}
.node .day{font-family:var(--font-mono);font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:6px}
.node p{margin:0;font-size:13.5px;line-height:1.5;color:var(--ink-2)}

/* tabelas */
h2{font-family:var(--font-display);font-weight:700;font-size:17px;margin:0 0 3px;letter-spacing:-.012em}
.hint{font-size:12.5px;color:var(--muted);margin:0 0 12px}
.tablebox{background:var(--surface);border:1px solid var(--grid);border-radius:10px;overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:520px}
th{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:11px 16px;border-bottom:1px solid var(--grid);font-weight:500}
td{padding:9px 16px;font-size:13.5px;border-bottom:1px solid var(--grid);color:var(--ink-2)}
tr:last-child td{border-bottom:0}
td.marco{color:var(--ink);font-weight:500}
td.num,th.num{font-family:var(--font-mono);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.mais{color:var(--crit);font-weight:600}
td.mais .ib{display:inline-block;height:9px;border-radius:2px;background:var(--crit);opacity:.75;margin-right:8px;vertical-align:middle}
tr.node-row td{background:color-mix(in srgb,var(--crit) 7%,transparent)}
.st{display:inline-flex;align-items:center;gap:7px;font-size:12px;white-space:nowrap}
.st i{width:9px;height:9px;border-radius:2px;flex:none}

/* dicas */
#tip{position:fixed;z-index:50;pointer-events:none;opacity:0;transition:opacity .1s;background:var(--ink);color:var(--surface);border-radius:6px;padding:7px 10px;font-size:12px;line-height:1.4;box-shadow:0 4px 14px rgba(0,0,0,.22);max-width:260px}
#tip b{font-family:var(--font-display);font-weight:600;display:block}
#tip span{font-family:var(--font-mono);font-size:10.5px;opacity:.78;display:block}
footer{font-size:12px;color:var(--muted);line-height:1.6;border-top:1px solid var(--grid);padding-top:14px}
.erro{background:var(--surface);color:var(--crit);border:1px solid var(--crit);border-radius:8px;padding:12px}
@media (max-width:560px){
  .lane,.ruler-row{grid-template-columns:96px 1fr;gap:10px}
  .overlay{margin-left:106px}
  .lane-name{font-size:11.5px}
}
@media print{#tip{display:none}.chart{overflow:visible}body{background:#fff}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <p class="eyebrow" id="eyebrow"></p>
    <h1 id="titulo">Cronograma</h1>
    <p class="sub" id="sub"></p>
    <dl class="meta" id="meta"></dl>
  </header>

  <div id="erro"></div>
  <div class="key" id="key"></div>

  <div class="chart">
    <div class="plot">
      <div class="plot-body" id="plot"></div>
      <div class="overlay" id="overlay"></div>
      <div class="ruler-row"><div></div><div class="ruler" id="ruler"></div></div>
    </div>
  </div>

  <section>
    <h2>Comparativo com o prazo ideal</h2>
    <p class="hint" id="cmpHint"></p>
    <div class="tablebox"><table id="cmp"></table></div>
  </section>

  <section>
    <h2>Análise do projeto</h2>
    <p class="hint">Pontos críticos, pontos de atenção e observações, tirados dos dados deste arquivo.</p>
    <div class="nodes" id="nodes"></div>
  </section>

  <section>
    <h2>Todas as tarefas</h2>
    <p class="hint">Em ordem de início. As linhas em vermelho claro estão no caminho crítico (folga zero).</p>
    <div class="tablebox"><table id="tarefas"></table></div>
  </section>

  <footer id="rodape"></footer>
</div>

<div id="tip" role="status" aria-live="polite"></div>

const parse=s=>{const p=String(s).split('-').map(Number);if(p.length!==3||p.some(isNaN))throw Error('Data inválida: "'+s+'" (use AAAA-MM-DD)');return new Date(p[0],p[1]-1,p[2]);};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fmt=d=>d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit'});
const curto=d=>String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0');
const add=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const dias=(a,b)=>Math.round((b-a)/DIA);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let D,T,byId,cal,uteis,fimG={};

function agendar(){
  D=JSON.parse($('dados').textContent);
  uteis=D.diasUteis!==false;
  const fer=new Set(D.feriados||[]);
  const ok=d=>!uteis||(d.getDay()!==0&&d.getDay()!==6&&!fer.has(iso(d)));
  cal=[];let c=parse(D.inicio);
  while(cal.length<4000){if(ok(c))cal.push(c);c=add(c,1);}
  const idx=s=>{const t=parse(s);const i=cal.findIndex(x=>x>=t);return i<0?cal.length-1:i;};
  T=D.tarefas||[];
  if(!T.length)throw Error('Nenhuma tarefa informada.');
  byId={};
  T.forEach(t=>{
    t.id=String(t.id);
    if(byId[t.id])throw Error('ID repetido: '+t.id);
    byId[t.id]=t;
    t.dur=t.marco?0:Math.max(1,Math.round(t.duracao||1));
    t.dep=(t.depende||[]).map(String);
    t.fase=t.fase||'Geral';
    t.ref=!!t.referencia;
  });
  const ordem=[],st={};
  const visita=t=>{
    if(st[t.id]===2)return;
    if(st[t.id]===1)throw Error('Dependência circular envolvendo a tarefa '+t.id+'.');
    st[t.id]=1;
    t.dep.forEach(d=>{if(!byId[d])throw Error('A tarefa '+t.id+' depende de "'+d+'", que não existe.');visita(byId[d]);});
    st[t.id]=2;ordem.push(t);
  };
  T.forEach(visita);
  // Tarefa já iniciada com data informada: vale a data informada (é o realizado).
  // Tarefa ainda não iniciada: a data informada é "não antes de" e a dependência pode empurrá-la.
  ordem.forEach(t=>{
    let dep=0;t.dep.forEach(d=>{dep=Math.max(dep,byId[d].ef);});
    const fixo=t.inicio?idx(t.inicio):null;
    if(fixo!==null&&(Number(t.progresso)||0)>0){t.es=fixo;t.sob=Math.max(0,dep-fixo);}
    else{t.es=Math.max(fixo||0,dep);t.sob=0;}
    t.ef=t.es+t.dur;
  });
  // Previsto/real e prazo ideal são duas cadeias separadas: cada uma tem o seu próprio fim.
  T.forEach(t=>{const g=t.ref?'r':'p';fimG[g]=Math.max(fimG[g]||0,t.ef);});
  const suc={};T.forEach(t=>t.dep.forEach(d=>{(suc[d]=suc[d]||[]).push(t);}));
  T.forEach(t=>{t.libera=suc[t.id]||[];});
  ordem.slice().reverse().forEach(t=>{
    const s=suc[t.id]||[];
    t.lf=s.length?Math.min(...s.map(x=>x.ls)):fimG[t.ref?'r':'p'];
    t.ls=t.lf-t.dur;t.folga=t.ls-t.es;t.critica=!t.ref&&t.folga===0;
  });
  T.forEach(t=>{
    if(t.dur){t.ini=cal[t.es];t.fim=cal[t.ef-1];}
    else{t.ini=t.fim=(t.es>0&&t.dep.length&&!t.inicio)?cal[t.es-1]:cal[t.es];}
    t.pr=Math.min(100,Math.max(0,Number(t.progresso)||0));
    t.st=t.pr>=100?'done':t.pr>0?'doing':'todo';
  });
}

const maxD=(l,k)=>l.reduce((m,t)=>t[k]>m?t[k]:m,l[0][k]);
const minD=(l,k)=>l.reduce((m,t)=>t[k]<m?t[k]:m,l[0][k]);
const un=()=>uteis?'dias úteis':'dias';
const SIT={done:'Concluída',doing:'Em andamento',todo:'A iniciar'};
const SITCOR={done:'var(--s3)',doing:'var(--s1)',todo:'var(--s1)'};

/* ---- tooltip ---- */
const tip=$('tip');
function mostraTip(e,titulo,linhas){
  tip.innerHTML=`<b>${esc(titulo)}</b>`+linhas.map(l=>`<span>${esc(l)}</span>`).join('');
  tip.style.opacity=1;
  const r=tip.getBoundingClientRect();
  const x=Math.min(Math.max(8,e.clientX-r.width/2),innerWidth-r.width-8);
  tip.style.left=x+'px';
  tip.style.top=Math.max(8,e.clientY-r.height-12)+'px';
}
const escondeTip=()=>{tip.style.opacity=0;};
function detalhes(t){
  const L=[];
  L.push(`${fmt(t.ini)}${t.dur?' → '+fmt(t.fim)+' · '+t.dur+' '+un():' · marco'}`);
  if(t.responsavel)L.push('Responsável: '+t.responsavel);
  if(t.ref)L.push('Prazo ideal (referência)');
  else if(t.dur){
    L.push('Situação: '+(t.st==='done'?'concluída':t.st==='doing'?t.pr+'% concluída':'a iniciar (previsão)'));
    if(t.pr<100)L.push('Folga: '+t.folga+' dia(s)'+(t.critica?' · caminho crítico':''));
  }
  if(t.dep.length)L.push('Depende de: '+t.dep.map(d=>byId[d].nome).join('; '));
  return L;
}
function ligaTip(el,titulo,linhas){
  el.addEventListener('pointerenter',e=>mostraTip(e,titulo,linhas));
  el.addEventListener('pointermove',e=>mostraTip(e,titulo,linhas));
  el.addEventListener('pointerleave',escondeTip);
  el.setAttribute('tabindex','0');
  el.addEventListener('focus',()=>{const r=el.getBoundingClientRect();mostraTip({clientX:r.left+r.width/2,clientY:r.top},titulo,linhas);});
  el.addEventListener('blur',escondeTip);
}

function montar(){
  const P=T.filter(t=>!t.ref),R=T.filter(t=>t.ref);
  const reais=P.filter(t=>t.dur);
  const a=minD(P,'ini'),b=maxD(P,'fim');
  const fimIdeal=R.length?maxD(R,'fim'):null;
  const START=minD(T,'ini'),END=maxD(T,'fim');
  const SPAN=dias(START,END)+1;
  const pct=d=>(dias(START,d)/SPAN)*100;
  const larg=(d1,d2)=>((dias(d1,d2)+1)/SPAN)*100;

  /* cabeçalho */
  const partes=String(D.projeto||'Cronograma').split(' · ');
  $('titulo').textContent=partes[0];
  $('eyebrow').textContent=partes.slice(1).join(' · ');
  document.title=D.projeto||'Cronograma';
  $('sub').textContent=(D.descricao?D.descricao+'. ':'')+'Cada faixa é uma etapa do financiamento. Em cima, o previsto e o realizado; embaixo, o prazo ideal.';
  const conc=reais.filter(t=>t.st==='done').length;
  const meta=[['Início',fmt(a)],['Término previsto',fmt(b)]];
  if(fimIdeal){meta.push(['Término no prazo ideal',fmt(fimIdeal)]);meta.push(['Diferença','+'+(fimG.p-fimG.r)+' '+un(),1]);}
  meta.push(['Tarefas concluídas',conc+' de '+reais.length]);
  meta.push(['No caminho crítico',reais.filter(t=>t.critica).length]);
  $('meta').innerHTML=meta.map(([k,v,al])=>`<div><dt>${k}</dt><dd${al?' class="alerta"':''}>${v}</dd></div>`).join('');

  /* legenda */
  $('key').innerHTML=
    `<span><i class="k-done"></i>Concluída</span>`+
    `<span><i class="k-doing"></i>Em andamento (parte escura = % feito)</span>`+
    `<span><i class="k-todo"></i>A iniciar (previsão)</span>`+
    (R.length?`<span><i class="k-ideal"></i>Prazo ideal</span>`:'')+
    `<span><i class="k-crit"></i>Caminho crítico</span>`+
    (R.length?`<span><i class="k-gap"></i>Atraso sobre o ideal</span>`:'');

  /* etapas, na ordem do prazo ideal (ou do previsto, se não houver ideal) */
  const ordemEt=[];
  (R.length?R.filter(t=>t.dur):reais).sort((x,y)=>x.ef-y.ef).forEach(t=>{if(t.etapa&&!ordemEt.includes(t.etapa))ordemEt.push(t.etapa);});
  reais.forEach(t=>{if(t.etapa&&!ordemEt.includes(t.etapa))ordemEt.push(t.etapa);});

  const plot=$('plot');
  const linhasCmp=[];
  let ant=0;
  ordemEt.forEach(et=>{
    const rs=reais.filter(t=>t.etapa===et).sort((x,y)=>x.es-y.es);
    const id=R.find(t=>t.dur&&t.etapa===et);
    const ef=rs.length?Math.max(...rs.map(t=>t.ef)):null;
    const dif=(id&&ef!=null)?ef-id.ef:null;
    const ac=dif!=null?dif-ant:null;if(dif!=null)ant=dif;
    const sit=!rs.length?'':rs.every(t=>t.st==='done')?'Concluída':rs.some(t=>t.pr>0)?'Em andamento':'Previsão';
    linhasCmp.push({et,sit,id,rs,fim:rs.length?maxD(rs,'fim'):null,dif,ac});

    const lane=document.createElement('div');lane.className='lane';
    const nome=document.createElement('div');nome.className='lane-name';
    nome.innerHTML=esc(et)+(sit?`<b>${sit}</b>`:'')+(ac!=null?`<b${ac>0?' class="mais"':''}>${ac>0?'+':''}${ac} ${un()}</b>`:'');
    const col=document.createElement('div');
    const rot=document.createElement('div');rot.className='labels';
    const track=document.createElement('div');track.className='track';

    let ultimo=-99,nivel=0;
    rs.forEach(t=>{
      const p=pct(t.ini);
      nivel=(p-ultimo<14)?1-nivel:0;ultimo=p;
      const l=document.createElement('div');
      l.className='mlabel lvl'+nivel+(p>82?' fim':' ini');
      l.style.left=(p>82?pct(t.fim)+larg(t.fim,t.fim):p)+'%';
      l.textContent=t.nome+' · '+curto(t.ini);
      rot.appendChild(l);
    });
    rs.forEach(t=>{
      const s=document.createElement('div');
      s.className='seg '+t.st+(t.critica?' crit':'');
      s.style.left=pct(t.ini)+'%';
      s.style.width=larg(t.ini,t.fim)+'%';
      s.style.setProperty('--p',t.pr+'%');
      ligaTip(s,t.nome,detalhes(t));
      track.appendChild(s);
    });
    rs.forEach(t=>{
      const d=document.createElement('div');
      d.className='dot '+t.st+(t.critica?' crit':'');
      d.style.left=pct(t.ini)+'%';
      ligaTip(d,t.nome,detalhes(t));
      track.appendChild(d);
    });
    if(id){
      const s=document.createElement('div');
      s.className='seg ideal';
      s.style.left=pct(id.ini)+'%';
      s.style.width=larg(id.ini,id.fim)+'%';
      ligaTip(s,id.nome+' (ideal)',detalhes(id));
      track.appendChild(s);
      const il=document.createElement('div');
      il.className='ilabel';
      il.style.left=(pct(id.fim)+larg(id.fim,id.fim))+'%';
      il.textContent='ideal termina '+curto(id.fim);
      track.appendChild(il);
    }
    col.appendChild(rot);col.appendChild(track);
    lane.appendChild(nome);lane.appendChild(col);plot.appendChild(lane);
  });

  /* faixa do contrato: ideal x previsto */
  const mReal=P.find(t=>t.marco),mIdeal=R.find(t=>t.marco);
  if(mReal){
    const lane=document.createElement('div');lane.className='lane';
    const dif=mIdeal?dias(mIdeal.ini,mReal.ini):null;
    const nome=document.createElement('div');nome.className='lane-name';
    nome.innerHTML=esc(mReal.nome.replace(/\s*\(.*\)\s*$/,''))+(dif!=null?`<b class="mais">+${dif} dias</b>`:'');
    const col=document.createElement('div');
    const rot=document.createElement('div');rot.className='labels';
    const track=document.createElement('div');track.className='track';
    const rl=document.createElement('div');
    const pr=pct(mReal.ini);
    rl.className='mlabel lvl0 '+(pr>82?'fim':'mid');rl.style.left=pr+'%';rl.textContent='previsto · '+curto(mReal.ini);
    rot.appendChild(rl);
    if(mIdeal){
      const pi=pct(mIdeal.ini);
      const il=document.createElement('div');
      il.className='mlabel lvl1 mid';il.style.left=pi+'%';il.textContent='ideal · '+curto(mIdeal.ini);
      rot.appendChild(il);
      const g=document.createElement('div');
      g.className='seg gap';g.style.left=pi+'%';g.style.width=(pr-pi)+'%';
      ligaTip(g,'Atraso sobre o ideal',['+'+dif+' dias',fmt(mIdeal.ini)+' → '+fmt(mReal.ini)]);
      track.appendChild(g);
      const di=document.createElement('div');di.className='dot';di.style.left=pi+'%';di.style.top='14px';di.style.background='var(--muted)';
      ligaTip(di,mIdeal.nome,[fmt(mIdeal.ini)]);
      track.appendChild(di);
    }
    const dr=document.createElement('div');dr.className='dot crit';dr.style.left=pr+'%';dr.style.top='14px';
    ligaTip(dr,mReal.nome,[fmt(mReal.ini)+' · marco']);
    track.appendChild(dr);
    col.appendChild(rot);col.appendChild(track);
    lane.appendChild(nome);lane.appendChild(col);plot.appendChild(lane);
  }

  /* régua, linhas de fundo, hoje e término ideal */
  const ruler=$('ruler'),overlay=$('overlay');
  const passo=SPAN>150?28:14;
  for(let k=0;k*passo<SPAN;k++){
    const d=add(START,k*passo),p=pct(d);
    const t=document.createElement('div');
    t.className='tick'+(k===0?' borda-ini':'');
    t.style.left=p+'%';t.textContent=curto(d);
    ruler.appendChild(t);
    const g=document.createElement('div');g.className='gridline';g.style.left=p+'%';overlay.appendChild(g);
  }
  const hoje=new Date();hoje.setHours(0,0,0,0);
  const linha=(d,cls,txt)=>{
    const p=pct(d);if(p<0||p>100)return;
    const v=document.createElement('div');v.className='vline '+cls;v.style.left=p+'%';
    const tg=document.createElement('span');tg.className='vtag '+cls;tg.textContent=txt;v.appendChild(tg);
    overlay.appendChild(v);
  };
  if(fimIdeal)linha(add(fimIdeal,1),'ideal','término ideal '+curto(fimIdeal));
  if(hoje>=START&&hoje<=END)linha(hoje,'hoje','hoje '+curto(hoje));

  /* comparativo */
  const mx=Math.max(1,...linhasCmp.map(l=>l.ac||0));
  $('cmp').innerHTML=`<thead><tr><th>Etapa</th><th>Situação</th><th class="num">Ideal: duração</th><th class="num">Ideal: termina</th><th class="num">Previsto: termina</th><th class="num">Atraso acumulado</th><th class="num">Acrescentado na etapa</th></tr></thead><tbody>`+
    linhasCmp.filter(l=>l.id).map(l=>`<tr><td class="marco">${esc(l.et)}</td><td>${l.sit}</td><td class="num">${l.id.dur} ${un()}</td><td class="num">${fmt(l.id.fim)}</td><td class="num">${l.fim?fmt(l.fim):'—'}</td><td class="num">${l.dif!=null?(l.dif>0?'+':'')+l.dif+' '+un():'—'}</td><td class="num${l.ac>0?' mais':''}">${l.ac>0?`<span class="ib" style="width:${Math.round(l.ac/mx*80)}px"></span>`:''}${l.ac!=null?(l.ac>0?'+':'')+l.ac+' '+un():'—'}</td></tr>`).join('')+'</tbody>';
  $('cmpHint').textContent='Atraso acumulado = quantos dias o fim da etapa fica depois do fim da mesma etapa no prazo ideal. Acrescentado na etapa = quanto o atraso cresceu naquela etapa.';

  /* análise */
  const A=D.analise||{};
  const cart=(tit,cls,l)=>(l||[]).map(i=>`<article class="node ${cls}"><span class="day">${tit}</span><p>${esc(i)}</p></article>`).join('');
  $('nodes').innerHTML=cart('Ponto crítico','c',A.criticos)+cart('Ponto de atenção','a',A.atencao)+cart('Observação','o',A.observacoes);

  /* todas as tarefas */
  const ord=reais.slice().sort((x,y)=>x.es-y.es||x.ef-y.ef);
  $('tarefas').innerHTML=`<thead><tr><th>Etapa</th><th>Tarefa</th><th>Responsável</th><th class="num">Início</th><th class="num">Fim</th><th class="num">Dias</th><th>Situação</th></tr></thead><tbody>`+
    ord.map(t=>`<tr class="${t.critica?'node-row':''}"><td>${esc(t.etapa||'')}</td><td class="marco">${esc(t.id)}. ${esc(t.nome)}</td><td>${esc(t.responsavel||'')}</td><td class="num">${fmt(t.ini)}</td><td class="num">${fmt(t.fim)}</td><td class="num">${t.dur}</td><td><span class="st"><i style="background:${SITCOR[t.st]}"></i>${SIT[t.st]}${t.st==='doing'?' · '+t.pr+'%':''}</span></td></tr>`).join('')+'</tbody>';

  /* rodapé */
  $('rodape').textContent=[
    'Fonte: dados deste arquivo (planilha do setor). '+(uteis?'Dias úteis.':'Dias corridos.'),
    D.notaComparativo||'',
    A.nota||''
  ].filter(Boolean).join(' ');
}

try{agendar();montar();}
catch(e){$('erro').innerHTML='<div class="erro"><b>Não foi possível montar o cronograma:</b> '+esc(e.message)+'</div>';}
})();
</script>
