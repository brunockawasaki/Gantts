<script>
(function(){
const $=id=>document.getElementById(id);
const DIA=864e5;
const parse=s=>{const p=String(s).split('-').map(Number);if(p.length!==3||p.some(isNaN))throw Error('Data inválida: "'+s+'" (use AAAA-MM-DD)');return new Date(p[0],p[1]-1,p[2]);};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fmt=d=>d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit'});
const curto=d=>String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0');
const add=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const dias=(a,b)=>Math.round((b-a)/DIA);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PX={dia:30,semana:14,mes:4};
const CORES=['#4e79a7','#59a14f','#f28e2b','#b07aa1','#76b7b2','#edc948','#e15759','#9c755f','#ff9da7','#8cd17d'];
let D,T,byId,cal,fimIdx,uteis,fases,zoom,soCrit=false,fimG={},semIdeal=false,etFixa=null;

function agendar(){
  D=JSON.parse($('dados').textContent);
  uteis=D.diasUteis!==false;
  const fer=new Set(D.feriados||[]);
  const ok=d=>!uteis||(d.getDay()!==0&&d.getDay()!==6&&!fer.has(iso(d)));
  cal=[];let c=parse(D.inicio);
  while(cal.length<4000){if(ok(c))cal.push(c);c=add(c,1);}
  const idx=s=>{const t=parse(s);const i=cal.findIndex(x=>x>=t);return i<0?cal.length-1:i;};
  T=D.tarefas||[];
  if(!T.length)throw Error('Nenhuma tarefa informada.');
  byId={};
  T.forEach(t=>{
    t.id=String(t.id);
    if(byId[t.id])throw Error('ID repetido: '+t.id);
    byId[t.id]=t;
    t.dur=t.marco?0:Math.max(1,Math.round(t.duracao||1));
    t.dep=(t.depende||[]).map(String);
    t.fase=t.fase||'Geral';
    t.ref=!!t.referencia;
  });
  const ordem=[],st={};
  const visita=t=>{
    if(st[t.id]===2)return;
    if(st[t.id]===1)throw Error('Dependência circular envolvendo a tarefa '+t.id+'.');
    st[t.id]=1;
    t.dep.forEach(d=>{if(!byId[d])throw Error('A tarefa '+t.id+' depende de "'+d+'", que não existe.');visita(byId[d]);});
    st[t.id]=2;ordem.push(t);
  };
  T.forEach(visita);
  // Tarefa já iniciada com data informada: a data informada vale (é o realizado).
  // Tarefa ainda não iniciada: a data informada é "não antes de" e a dependência pode empurrá-la.
  ordem.forEach(t=>{
    let dep=0;t.dep.forEach(d=>{dep=Math.max(dep,byId[d].ef);});
    const fixo=t.inicio?idx(t.inicio):null;
    if(fixo!==null&&(Number(t.progresso)||0)>0){t.es=fixo;t.sob=Math.max(0,dep-fixo);}
    else{t.es=Math.max(fixo||0,dep);t.sob=0;}
    t.ef=t.es+t.dur;
  });
  // Previsto/real e prazo ideal são duas cadeias separadas: cada uma tem o seu próprio fim.
  T.forEach(t=>{const g=t.ref?'r':'p';fimG[g]=Math.max(fimG[g]||0,t.ef);});
  fimIdx=Math.max(1,...T.map(t=>t.ef));
  const suc={};T.forEach(t=>t.dep.forEach(d=>{(suc[d]=suc[d]||[]).push(t);}));
  T.forEach(t=>{t.libera=suc[t.id]||[];});
  ordem.slice().reverse().forEach(t=>{
    const s=suc[t.id]||[];
    t.lf=s.length?Math.min(...s.map(x=>x.ls)):fimG[t.ref?'r':'p'];
    t.ls=t.lf-t.dur;t.folga=t.ls-t.es;t.critica=!t.ref&&t.folga===0;
  });
  T.forEach(t=>{
    if(t.dur){t.ini=cal[t.es];t.fim=cal[t.ef-1];}
    else{t.ini=t.fim=(t.es>0&&t.dep.length&&!t.inicio)?cal[t.es-1]:cal[t.es];}
  });
  fases=[];T.forEach(t=>{if(!fases.includes(t.fase))fases.push(t.fase);});
  zoom=fimIdx<=30?'dia':fimIdx<=200?'semana':'mes';
}

function cor(f){return CORES[fases.indexOf(f)%CORES.length];}
const maxD=(l,k)=>l.reduce((m,t)=>t[k]>m?t[k]:m,l[0][k]);
const minD=(l,k)=>l.reduce((m,t)=>t[k]<m?t[k]:m,l[0][k]);

function resumo(){
  const P=T.filter(t=>!t.ref),R=T.filter(t=>t.ref);
  const a=minD(P,'ini'),b=maxD(P,'fim');
  const dur=fimG.p-Math.min(...P.map(t=>t.es));
  const un=uteis?' dias úteis':' dias';
  document.title=D.projeto||'Cronograma';
  $('titulo').textContent=D.projeto||'Cronograma';
  $('sub').textContent=(D.descricao?D.descricao+' · ':'')+(uteis?'Durações em dias úteis (seg–sex, sem feriados)':'Durações em dias corridos');
  const k=[['Início',fmt(a)],['Término previsto',fmt(b)],['Duração prevista',dur+un],['Tarefas',P.filter(t=>!t.marco).length],['No caminho crítico',P.filter(t=>t.critica&&t.dur).length]];
  if(R.length){k.push(['Término no prazo ideal',fmt(maxD(R,'fim'))]);k.push(['Diferença para o ideal','+'+(fimG.p-fimG.r)+un]);}
  $('kpis').innerHTML=k.map(([l,v])=>`<div class="kpi"><span>${l}</span><b>${v}</b></div>`).join('');
  $('legend').innerHTML=fases.map(f=>`<span><i class="sw" style="background:${cor(f)}"></i>${esc(f)}</span>`).join('')+
    `<span><i class="sw" style="outline:2px solid var(--crit);background:transparent"></i>Caminho crítico (folga zero)</span>`+
    `<span><i class="sw" style="background:var(--ink);width:10px;height:10px;transform:rotate(45deg)"></i>Marco</span>`+
    (R.length?`<span><i class="sw" style="width:0;height:14px;border-radius:0;border-left:2px dashed var(--muted)"></i>Término no prazo ideal</span>`:'')+
    `<span><i class="sw" style="background:var(--today);width:2px;height:14px"></i>Hoje</span>`+
    `<span><i class="sw" style="background:#4e79a7;box-shadow:inset 7px 0 rgba(0,0,0,.28)"></i>Parte escura = % concluído</span>`;
}

function comparar(){
  const un=uteis?'dias úteis':'dias';
  const R=T.filter(t=>t.ref&&t.dur).sort((a,b)=>a.ef-b.ef);
  let ant=0,h='';
  R.forEach(r=>{
    const re=T.filter(t=>!t.ref&&t.dur&&t.etapa===r.etapa);
    if(!re.length)return;
    const ef=Math.max(...re.map(t=>t.ef)),fim=maxD(re,'fim');
    const pr=re.map(t=>Number(t.progresso)||0);
    const sit=pr.every(p=>p>=100)?'Concluída':pr.some(p=>p>0)?'Em andamento':'Previsão';
    const dif=ef-r.ef,ac=dif-ant;ant=dif;
    h+=`<tr data-et="${esc(r.etapa)}" tabindex="0"><td>${esc(r.etapa)}</td><td>${sit}</td><td>${r.dur} ${un}</td><td>${fmt(r.fim)}</td><td>${fmt(fim)}</td><td>${dif>0?'+':''}${dif} ${un}</td><td class="${ac>0?'mais':''}">${ac>0?'+':''}${ac} ${un}</td></tr>`;
  });
  $('cmp').innerHTML=`<thead><tr><th>Etapa</th><th>Situação</th><th>Ideal: duração</th><th>Ideal: termina em</th><th>Real/previsto: termina em</th><th>Atraso acumulado</th><th>Acrescentado na etapa</th></tr></thead><tbody>${h}</tbody>`;
  $('cmpNota').textContent='Atraso acumulado = quantos dias o fim da etapa fica depois do fim da mesma etapa no prazo ideal. Acrescentado na etapa = quanto o atraso cresceu naquela etapa. '+(D.notaComparativo||'');
}

function analise(){
  const A=D.analise||{};
  const bx=(t,c,l)=>`<div class="${c}"><h3>${t}</h3><ul>${(l&&l.length?l:['Nada a apontar.']).map(i=>`<li>${esc(i)}</li>`).join('')}</ul></div>`;
  $('analise').innerHTML=bx('Pontos críticos','c',A.criticos)+bx('Pontos de atenção','a',A.atencao)+bx('Observações','o',A.observacoes);
  $('analiseNota').textContent=A.nota||'';
}

function desenhar(){
  const px=PX[zoom];
  document.querySelectorAll('[data-z]').forEach(o=>o.classList.toggle('on',o.dataset.z===zoom));
  const p0=minD(T,'ini');
  const ini=add(p0,-((p0.getDay()+6)%7));
  const fim=add(maxD(T,'fim'),21);
  const W=(dias(ini,fim)+1)*px;
  const x=d=>dias(ini,d)*px;
  const grade=`width:${W}px;background-image:repeating-linear-gradient(to right,var(--grid) 0 1px,transparent 1px ${7*px}px)`;
  const hoje=new Date();hoje.setHours(0,0,0,0);
  let lh=(hoje>=ini&&hoje<=fim)?`<div class="today" style="left:${x(hoje)+px/2}px" title="Hoje"></div>`:'';
  const R=T.filter(t=>t.ref);
  if(R.length){const fi=maxD(R,'fim');lh+=`<div class="ideal" style="left:${x(fi)+px}px" title="Término no prazo ideal: ${fmt(fi)}"></div>`;}
  let h='';
  for(let d=new Date(ini.getFullYear(),ini.getMonth(),1);d<=fim;d=new Date(d.getFullYear(),d.getMonth()+1,1)){
    const a=d<ini?ini:d, b=new Date(d.getFullYear(),d.getMonth()+1,1);
    const w=x(b>fim?add(fim,1):b)-x(a);
    h+=`<div class="tick" style="left:${x(a)}px;width:${w}px;top:0;height:22px">${d.toLocaleDateString('pt-BR',{month:'short',year:'2-digit'})}</div>`;
  }
  if(zoom!=='mes'){
    const passo=zoom==='dia'?1:7;
    for(let d=ini;d<=fim;d=add(d,passo))h+=`<div class="tick" style="left:${x(d)}px;width:${passo*px}px;top:22px;bottom:0">${zoom==='dia'?d.getDate():curto(d)}</div>`;
  }
  let out=`<div class="row head"><div class="left">Tarefa</div><div class="tl" style="width:${W}px">${h}</div></div>`;
  fases.forEach(f=>{
    let ts=T.filter(t=>t.fase===f).sort((a,b)=>a.es-b.es||a.ef-b.ef);
    if(soCrit)ts=ts.filter(t=>t.critica);
    if(semIdeal)ts=ts.filter(t=>!t.ref);
    if(!ts.length)return;
    const a=minD(ts,'ini'), b=maxD(ts,'fim');
    if(fases.length>1)out+=`<div class="row fase"><div class="left"><i class="sw" style="background:${cor(f)}"></i>${esc(f)}</div><div class="tl" style="${grade}">${lh}<div class="sum" style="left:${x(a)}px;width:${x(b)-x(a)+px}px"></div></div></div>`;
    ts.forEach(t=>{
      const pr0=Math.min(100,Math.max(0,Number(t.progresso)||0));
      let g;
      if(t.dur){
        const l=x(t.ini),w=x(t.fim)-l+px;
        g=`<div class="bar${t.critica?' crit':''}" style="left:${l}px;width:${w}px;background:${cor(f)}"><i style="width:${pr0}%"></i></div><div class="lbl" style="left:${l+w+6}px">${esc(t.nome)}${pr0?' · '+pr0+'%':''}</div>`;
      }else{
        const l=x(t.ini)+px/2-7;
        g=`<div class="ms${t.critica?' crit':''}" style="left:${l}px"></div><div class="lbl" style="left:${l+20}px">${esc(t.nome)} · ${curto(t.ini)}</div>`;
      }
      const meta=[t.responsavel,t.dur?`${curto(t.ini)} → ${curto(t.fim)}`:curto(t.ini),t.dur?t.dur+'d':'marco'].filter(Boolean).map(esc).join(' · ');
      out+=`<div class="row" data-id="${esc(t.id)}" tabindex="0"><div class="left"><div class="n">${esc(t.id)}. ${esc(t.nome)}</div><div class="m">${meta}</div></div><div class="tl" style="${grade}">${lh}${g}</div></div>`;
    });
  });
  $('chart').innerHTML=out;
  aplicaFixo();
}

const tip=$('tip');
function mostra(html,x,y){
  tip.innerHTML=html;tip.style.opacity=1;
  const r=tip.getBoundingClientRect();
  tip.style.left=Math.min(Math.max(8,x-r.width/2),innerWidth-r.width-8)+'px';
  tip.style.top=(y-r.height-14<8?y+18:y-r.height-14)+'px';
}
function esconde(){tip.style.opacity=0;}
function tipHTML(t){
  const un=uteis?' dias úteis':' dias';
  const pr=Math.min(100,Math.max(0,Number(t.progresso)||0));
  const L=[`<b>${esc(t.nome)}</b>`,`<span>${fmt(t.ini)}${t.dur?' → '+fmt(t.fim)+' · '+t.dur+un:' · marco'}</span>`];
  if(t.responsavel)L.push(`<span>Responsável: ${esc(t.responsavel)}</span>`);
  if(t.ref)L.push('<span>Referência: prazo ideal</span>');
  else if(t.dur){
    L.push(`<span>Situação: ${pr>=100?'concluída':pr>0?pr+'% concluída':'a iniciar'}</span>`);
    if(pr<100)L.push(`<span>Folga: ${t.folga} dia(s)${t.critica?' · caminho crítico':''}</span>`);
  }
  if(t.dep.length)L.push(`<span>Depende de: ${t.dep.map(d=>esc(d+'. '+byId[d].nome)).join('; ')}</span>`);
  if(t.libera.length)L.push(`<span>Libera: ${t.libera.map(x=>esc(x.id+'. '+x.nome)).join('; ')}</span>`);
  if(t.sob)L.push(`<span>A data da planilha começa ${t.sob} dia(s) antes do fim da tarefa anterior</span>`);
  return L.join('');
}
function destaca(ids){
  document.querySelectorAll('#chart .row[data-id]').forEach(r=>{
    const on=ids.has(r.dataset.id);r.classList.toggle('dim',!on);r.classList.toggle('link',on);
  });
}
function limpa(){document.querySelectorAll('#chart .row[data-id]').forEach(r=>r.classList.remove('dim','link'));}
const idsEtapa=et=>new Set(T.filter(t=>t.etapa===et).map(t=>t.id));
const idsTarefa=t=>new Set([t.id,...t.dep,...t.libera.map(x=>x.id)]);
function aplicaFixo(){
  document.querySelectorAll('#cmp tbody tr').forEach(tr=>tr.classList.toggle('sel',tr.dataset.et===etFixa));
  if(etFixa)destaca(idsEtapa(etFixa));else limpa();
}
function ligar(){
  const ch=$('chart'),cm=$('cmp');
  ch.addEventListener('pointermove',e=>{
    const r=e.target.closest('.row[data-id]');
    if(!r){aplicaFixo();esconde();return;}
    const t=byId[r.dataset.id];destaca(idsTarefa(t));
    if(e.target.closest('.bar,.ms,.left'))mostra(tipHTML(t),e.clientX,e.clientY);else esconde();
  });
  ch.addEventListener('pointerleave',()=>{aplicaFixo();esconde();});
  ch.addEventListener('focusin',e=>{
    const r=e.target.closest('.row[data-id]');if(!r)return;
    const t=byId[r.dataset.id];destaca(idsTarefa(t));
    const b=r.querySelector('.left').getBoundingClientRect();
    mostra(tipHTML(t),b.left+b.width/2,b.top);
  });
  ch.addEventListener('focusout',()=>{aplicaFixo();esconde();});
  cm.addEventListener('pointerover',e=>{const tr=e.target.closest('tbody tr');if(tr)destaca(idsEtapa(tr.dataset.et));});
  cm.addEventListener('pointerleave',aplicaFixo);
  cm.addEventListener('click',e=>{
    const tr=e.target.closest('tbody tr');if(!tr)return;
    etFixa=etFixa===tr.dataset.et?null:tr.dataset.et;aplicaFixo();
    if(etFixa)ch.scrollIntoView({behavior:'smooth',block:'start'});
  });
  cm.addEventListener('keydown',e=>{
    if((e.key==='Enter'||e.key===' ')&&e.target.matches('tbody tr')){e.preventDefault();e.target.click();}
  });
  const bi=$('bIdeal');
  if(!T.some(t=>t.ref))bi.hidden=true;
  bi.onclick=e=>{
    semIdeal=!semIdeal;e.currentTarget.classList.toggle('on',semIdeal);
    e.currentTarget.textContent=semIdeal?'Mostrar prazo ideal':'Ocultar prazo ideal';desenhar();
  };
}

try{
  agendar();resumo();comparar();analise();desenhar();ligar();
  document.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>{zoom=b.dataset.z;desenhar();});
  $('bCrit').onclick=e=>{soCrit=!soCrit;e.currentTarget.classList.toggle('on',soCrit);desenhar();};
}catch(e){
  $('erro').innerHTML='<div class="erro"><b>Não foi possível montar o cronograma:</b> '+esc(e.message)+'</div>';
}
})();
</script>

</body></html>
