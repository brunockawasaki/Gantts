<title>Now · Financiamento CEF</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1c1c1a;--muted:#6d6c66;--line:#e3e1da;--grid:#efede7;--crit:#c8372d;--today:#e08a00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151514;--card:#1e1e1c;--ink:#ecebe5;--muted:#a19f97;--line:#34332f;--grid:#292825;--crit:#ff6a5c;--today:#ffb23a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151514;--card:#1e1e1c;--ink:#ecebe5;--muted:#a19f97;--line:#34332f;--grid:#292825;--crit:#ff6a5c;--today:#ffb23a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.page{max-width:1400px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:22px;margin:0 0 2px}
.sub{color:var(--muted);font-size:13px}
.kpis{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-width:110px}
.kpi span{display:block;color:var(--muted);font-size:12px}
.kpi b{font-size:17px}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;align-items:center}
.tools button{font:inherit;font-size:13px;padding:5px 11px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.tools button.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.chart{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:75vh}
.row{display:flex;min-width:max-content;height:46px;border-bottom:1px solid var(--grid)}
.row.fase{height:34px}
.row.head{height:44px;position:sticky;top:0;z-index:3;background:var(--card);border-bottom:1px solid var(--line)}
.left{position:sticky;left:0;z-index:2;width:290px;flex:none;background:var(--card);border-right:1px solid var(--line);padding:6px 10px;overflow:hidden}
.head .left{z-index:4;font-weight:600;display:flex;align-items:flex-end}
.fase .left{font-weight:600;display:flex;align-items:center;gap:8px}
.left .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.left .m{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl{position:relative;flex:none}
.tick{position:absolute;border-left:1px solid var(--line);font-size:11px;color:var(--muted);padding:3px 4px;white-space:nowrap;overflow:hidden}
.bar{position:absolute;top:14px;height:18px;border-radius:4px;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;left:0;background:rgba(0,0,0,.28)}
.bar.crit{outline:2px solid var(--crit);outline-offset:1px}
.sum{position:absolute;top:14px;height:6px;border-radius:3px;background:var(--muted);opacity:.6}
.ms{position:absolute;top:16px;width:14px;height:14px;transform:rotate(45deg);background:var(--ink)}
.ms.crit{background:var(--crit)}
.lbl{position:absolute;top:14px;font-size:12px;line-height:18px;white-space:nowrap;color:var(--muted);pointer-events:none}
.today{position:absolute;top:0;bottom:0;width:2px;background:var(--today);z-index:1}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;color:var(--muted);font-size:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:10px;border-radius:3px;display:inline-block;flex:none}
.erro{background:var(--card);color:var(--crit);border:1px solid var(--crit);border-radius:8px;padding:12px;margin:16px 0}
@media (max-width:640px){.left{width:150px}.kpi{min-width:0;flex:1 1 40%}}
@media print{.tools{display:none}.chart{overflow:visible;max-height:none}body{background:#fff}}

.cmp{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);font-size:13px}

.cmp tbody tr{cursor:pointer}
.cmp tbody tr:hover td,.cmp tbody tr.sel td{background:var(--grid)}
.cmp tbody tr:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}

/* análise */
.an{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}

.an .c{border-left-color:var(--crit)}
.an .a{border-left-color:var(--today)}
.an h3{margin:0 0 6px;font-size:14px}
.an ul{margin:0;padding-left:18px}
.an li{margin:6px 0}
@media print{.det{display:none}.main{display:block}.an>div,.cmp{break-inside:avoid}.chart{max-height:none;overflow:visible}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
(function(){
const $=id=>document.getElementById(id);
const DIA=864e5;
const parse=s=>{const p=String(s).split('-').map(Number);if(p.length!==3||p.some(isNaN))throw Error('Data inválida: "'+s+'" (use AAAA-MM-DD)');return new Date(p[0],p[1]-1,p[2]);};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fmt=d=>d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit'});
const curto=d=>String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0');
const add=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const dias=(a,b)=>Math.round((b-a)/DIA);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PX={dia:30,semana:14,mes:4};
let D,T,byId,cal,fimIdx,uteis,fases,zoom='ajustar',soCrit=false,semIdeal=false,fimG={};
let sel=null,hov=null,etFixa=null,etHov=null,ETAPAS={};

function agendar(){
  D=JSON.parse($('dados').textContent);
  uteis=D.diasUteis!==false;
  const fer=new Set(D.feriados||[]);
  const ok=d=>!uteis||(d.getDay()!==0&&d.getDay()!==6&&!fer.has(iso(d)));
  cal=[];let c=parse(D.inicio);
  while(cal.length<4000){if(ok(c))cal.push(c);c=add(c,1);}
  const idx=s=>{const t=parse(s);const i=cal.findIndex(x=>x>=t);return i<0?cal.length-1:i;};
  T=D.tarefas||[];
  if(!T.length)throw Error('Nenhuma tarefa informada.');
  byId={};
  T.forEach(t=>{
    t.id=String(t.id);
    if(byId[t.id])throw Error('ID repetido: '+t.id);
    byId[t.id]=t;
    t.dur=t.marco?0:Math.max(1,Math.round(t.duracao||1));
    t.dep=(t.depende||[]).map(String);
    t.fase=t.fase||'Geral';
    t.ref=!!t.referencia;
  });
  const ordem=[],st={};
  const visita=t=>{
    if(st[t.id]===2)return;
    if(st[t.id]===1)throw Error('Dependência circular envolvendo a tarefa '+t.id+'.');
    st[t.id]=1;
    t.dep.forEach(d=>{if(!byId[d])throw Error('A tarefa '+t.id+' depende de "'+d+'", que não existe.');visita(byId[d]);});
    st[t.id]=2;ordem.push(t);
  };
  T.forEach(visita);
  // Tarefa já iniciada com data informada: vale a data informada (é o realizado).
  // Tarefa ainda não iniciada: a data informada é "não antes de" e a dependência pode empurrá-la.
  ordem.forEach(t=>{
    let dep=0;t.dep.forEach(d=>{dep=Math.max(dep,byId[d].ef);});
    const fixo=t.inicio?idx(t.inicio):null;
    if(fixo!==null&&(Number(t.progresso)||0)>0){t.es=fixo;t.sob=Math.max(0,dep-fixo);}
    else{t.es=Math.max(fixo||0,dep);t.sob=0;}
    t.ef=t.es+t.dur;
  });
  // Previsto/real e prazo ideal são duas cadeias separadas: cada uma tem o seu próprio fim.
  T.forEach(t=>{const g=t.ref?'r':'p';fimG[g]=Math.max(fimG[g]||0,t.ef);});
  fimIdx=Math.max(1,...T.map(t=>t.ef));
  const suc={};T.forEach(t=>t.dep.forEach(d=>{(suc[d]=suc[d]||[]).push(t);}));
  T.forEach(t=>{t.libera=suc[t.id]||[];});
  ordem.slice().reverse().forEach(t=>{
    const s=suc[t.id]||[];
    t.lf=s.length?Math.min(...s.map(x=>x.ls)):fimG[t.ref?'r':'p'];
    t.ls=t.lf-t.dur;t.folga=t.ls-t.es;t.critica=!t.ref&&t.folga===0;
  });
  T.forEach(t=>{
    if(t.dur){t.ini=cal[t.es];t.fim=cal[t.ef-1];}
    else{t.ini=t.fim=(t.es>0&&t.dep.length&&!t.inicio)?cal[t.es-1]:cal[t.es];}
    const p=Math.min(100,Math.max(0,Number(t.progresso)||0));
    t.pr=p;
    t.st=t.ref?'ref':t.marco?'marco':p>=100?'done':p>0?'doing':'todo';
  });
  fases=[];T.forEach(t=>{if(!fases.includes(t.fase))fases.push(t.fase);});
}

const maxD=(l,k)=>l.reduce((m,t)=>t[k]>m?t[k]:m,l[0][k]);
const minD=(l,k)=>l.reduce((m,t)=>t[k]<m?t[k]:m,l[0][k]);
const un=()=>uteis?'dias úteis':'dias';

function resumo(){
  const P=T.filter(t=>!t.ref),R=T.filter(t=>t.ref);
  const a=minD(P,'ini'),b=maxD(P,'fim');
  const dur=fimG.p-Math.min(...P.map(t=>t.es));
  document.title=D.projeto||'Cronograma';
  $('titulo').textContent=D.projeto||'Cronograma';
  $('sub').textContent=(D.descricao?D.descricao+' · ':'')+(uteis?'Durações em dias úteis (seg–sex, sem feriados)':'Durações em dias corridos');
  const k=[['Início',fmt(a)],['Término previsto',fmt(b)],['Duração prevista',dur+' '+un()],['Tarefas',P.filter(t=>!t.marco).length],['No caminho crítico',P.filter(t=>t.critica&&t.dur).length]];
  if(R.length){k.push(['Término no prazo ideal',fmt(maxD(R,'fim'))]);k.push(['Diferença para o ideal','+'+(fimG.p-fimG.r)+' '+un(),1]);}
  $('kpis').innerHTML=k.map(([l,v,al])=>`<div class="kpi${al?' alerta':''}"><span>${l}</span><b>${v}</b></div>`).join('');
  $('legend').innerHTML=
    `<span><i class="sw s-done"></i>Concluída</span>`+
    `<span><i class="sw s-doing"></i>Em andamento (parte escura = % feito)</span>`+
    `<span><i class="sw s-todo"></i>A iniciar (previsão)</span>`+
    (R.length?`<span><i class="sw s-ref"></i>Prazo ideal</span>`:'')+
    `<span><i class="sw" style="outline:2px solid var(--crit);background:transparent"></i>Caminho crítico (folga zero)</span>`+
    `<span><i class="sw" style="background:var(--ink);width:10px;height:10px;transform:rotate(45deg)"></i>Marco</span>`+
    `<span><b style="color:var(--muted)">→</b>Dependência</span>`+
    (R.length?`<span><i class="sw" style="width:0;height:14px;border-radius:0;border-left:2px dashed var(--muted)"></i>Término no prazo ideal</span>`:'')+
    `<span><i class="sw" style="background:var(--today);width:2px;height:14px"></i>Hoje</span>`;
}

function comparar(){
  const R=T.filter(t=>t.ref&&t.dur).sort((a,b)=>a.ef-b.ef);
  let ant=0;const L=[];
  ETAPAS={};
  R.forEach(r=>{
    const re=T.filter(t=>!t.ref&&t.dur&&t.etapa===r.etapa);
    if(!re.length)return;
    const ef=Math.max(...re.map(t=>t.ef)),fim=maxD(re,'fim');
    const pr=re.map(t=>t.pr);
    const sit=pr.every(p=>p>=100)?'Concluída':pr.some(p=>p>0)?'Em andamento':'Previsão';
    const dif=ef-r.ef,ac=dif-ant;ant=dif;
    ETAPAS[r.etapa]={ideal:r,fim,dif,ac};
    L.push({et:r.etapa,sit,dur:r.dur,idFim:r.fim,fim,dif,ac});
  });
  const mx=Math.max(1,...L.map(l=>l.ac));
  const h=L.map(l=>`<tr data-et="${esc(l.et)}" tabindex="0"><td>${esc(l.et)}</td><td>${l.sit}</td><td>${l.dur} ${un()}</td><td>${fmt(l.idFim)}</td><td>${fmt(l.fim)}</td><td>${l.dif>0?'+':''}${l.dif} ${un()}</td><td class="${l.ac>0?'mais':''}">${l.ac>0?`<span class="ib" style="width:${Math.round(l.ac/mx*90)}px"></span>`:''}${l.ac>0?'+':''}${l.ac} ${un()}</td></tr>`).join('');
  $('cmp').innerHTML=`<thead><tr><th>Etapa</th><th>Situação</th><th>Ideal: duração</th><th>Ideal: termina em</th><th>Real/previsto: termina em</th><th>Atraso acumulado</th><th>Acrescentado na etapa</th></tr></thead><tbody>${h}</tbody>`;
  $('cmpNota').textContent='Atraso acumulado = quantos dias o fim da etapa fica depois do fim da mesma etapa no prazo ideal. Acrescentado na etapa = quanto o atraso cresceu naquela etapa. Clique numa linha para destacá-la no gráfico. '+(D.notaComparativo||'');
}

function analise(){
  const A=D.analise||{};
  const bx=(t,c,l)=>`<div class="${c}"><h3>${t}</h3><ul>${(l&&l.length?l:['Nada a apontar.']).map(i=>`<li>${esc(i)}</li>`).join('')}</ul></div>`;
  $('analise').innerHTML=bx('Pontos críticos','c',A.criticos)+bx('Pontos de atenção','a',A.atencao)+bx('Observações','o',A.observacoes);
  $('analiseNota').textContent=A.nota||'';
}

function desenhar(){
  const LEFT=innerWidth<=640?150:360;
  document.querySelectorAll('[data-z]').forEach(o=>o.classList.toggle('on',o.dataset.z===zoom));
  const p0=minD(T,'ini');
  const ini=add(p0,-((p0.getDay()+6)%7));
  const fim=add(maxD(T,'fim'),12);
  const total=dias(ini,fim)+1;
  let px=PX[zoom];
  if(zoom==='ajustar')px=Math.max(4,Math.min(30,($('chart').clientWidth-LEFT-16)/total));
  const W=total*px;
  const x=d=>dias(ini,d)*px;
  const passo=px>=20?1:(px*7>=44?7:14);
  const grade=`width:${W}px;background-image:repeating-linear-gradient(to right,var(--grid) 0 1px,transparent 1px ${7*px}px)`;
  const hoje=new Date();hoje.setHours(0,0,0,0);
  let lh=(hoje>=ini&&hoje<=fim)?`<div class="today" style="left:${x(hoje)+px/2}px"></div>`:'';
  const R=T.filter(t=>t.ref);
  if(R.length)lh+=`<div class="ideal" style="left:${x(maxD(R,'fim'))+px}px"></div>`;
  let h='';
  for(let d=new Date(ini.getFullYear(),ini.getMonth(),1);d<=fim;d=new Date(d.getFullYear(),d.getMonth()+1,1)){
    const a=d<ini?ini:d, b=new Date(d.getFullYear(),d.getMonth()+1,1);
    const w=x(b>fim?add(fim,1):b)-x(a);
    h+=`<div class="tick" style="left:${x(a)}px;width:${w}px;top:0;height:22px">${d.toLocaleDateString('pt-BR',{month:'short',year:'2-digit'})}</div>`;
  }
  if(zoom!=='mes'){
    for(let d=ini;d<=fim;d=add(d,passo))h+=`<div class="tick" style="left:${x(d)}px;width:${passo*px}px;top:22px;bottom:0">${passo===1?d.getDate():curto(d)}</div>`;
  }
  let out=`<div class="plot" id="plot"><svg id="lig"></svg><div class="row head"><div class="left">Tarefa</div><div class="tl" style="width:${W}px">${h}</div></div>`;
  fases.forEach(f=>{
    let ts=T.filter(t=>t.fase===f).sort((a,b)=>a.es-b.es||a.ef-b.ef);
    if(soCrit)ts=ts.filter(t=>t.critica);
    if(semIdeal)ts=ts.filter(t=>!t.ref);
    if(!ts.length)return;
    const a=minD(ts,'ini'), b=maxD(ts,'fim');
    if(fases.length>1)out+=`<div class="row fase"><div class="left"><i class="sw ${ts[0].ref?'s-ref':'s-doing'}"></i>${esc(f)}</div><div class="tl" style="${grade}">${lh}<div class="sum" style="left:${x(a)}px;width:${x(b)-x(a)+px}px"></div></div></div>`;
    ts.forEach(t=>{
      const est=Math.ceil((t.nome.length+(t.pr&&t.dur?6:0))*6.4)+12;
      let g;
      if(t.dur){
        const l=x(t.ini),w=x(t.fim)-l+px;
        const lbl=esc(t.nome)+(t.pr&&!t.ref?' · '+t.pr+'%':'');
        const pos=(l+w+6+est>W&&l-6-est>=0)?`right:${W-l+6}px`:`left:${l+w+6}px`;
        g=`<div class="bar s-${t.st}${t.critica?' crit':''}" style="left:${l}px;width:${w}px">${t.st==='doing'?`<i style="width:${t.pr}%"></i>`:''}</div><div class="lbl ${pos.startsWith('right')?'dir':''}" style="${pos}">${lbl}</div>`;
      }else{
        const l=x(t.ini)+px/2-7;
        const pos=(l+20+est>W&&l-6-est>=0)?`right:${W-l+6}px`:`left:${l+20}px`;
        g=`<div class="ms${t.critica?' crit':''}" style="left:${l}px"></div><div class="lbl ${pos.startsWith('right')?'dir':''}" style="${pos}">${esc(t.nome)} · ${curto(t.ini)}</div>`;
      }
      const meta=[t.responsavel,t.dur?`${curto(t.ini)} → ${curto(t.fim)}`:curto(t.ini),t.dur?t.dur+'d':'marco'].filter(Boolean).map(esc).join(' · ');
      out+=`<div class="row" data-id="${esc(t.id)}" tabindex="0"><div class="left"><div class="n">${esc(t.id)}. ${esc(t.nome)}</div><div class="m">${meta}</div></div><div class="tl" style="${grade}">${lh}${g}</div></div>`;
    });
  });
  out+='</div>';
  $('chart').innerHTML=out;
  conectar();
  atualiza();
}

// setas de dependência (desenhadas depois que o gráfico está na página)
function conectar(){
  const plot=$('plot'),svg=$('lig');if(!plot||!svg)return;
  const rows={};plot.querySelectorAll('.row[data-id]').forEach(r=>{rows[r.dataset.id]=r;});
  const geo=id=>{
    const r=rows[id];if(!r)return null;
    const tl=r.querySelector('.tl');
    const el=r.querySelector('.bar')||r.querySelector('.ms');
    const xs=tl.offsetLeft+el.offsetLeft;
    return {xs,xe:xs+el.offsetWidth,y:r.offsetTop+23};
  };
  let h='';
  T.forEach(t=>{
    const b=geo(t.id);if(!b)return;
    t.dep.forEach(d=>{
      const a=geo(d);if(!a)return;
      const crit=byId[d].critica&&t.critica?' crit':'';
      const xm=a.xe+5,x2=Math.max(b.xs,xm);
      h+=`<path class="lk${crit}" data-a="${esc(d)}" data-b="${esc(t.id)}" d="M${a.xe} ${a.y} H${xm} V${b.y} H${x2}"/>`+
         `<polygon class="ar${crit}" data-a="${esc(d)}" data-b="${esc(t.id)}" points="${x2},${b.y} ${x2-6},${b.y-3.5} ${x2-6},${b.y+3.5}"/>`;
    });
  });
  svg.setAttribute('width',plot.scrollWidth);svg.setAttribute('height',plot.scrollHeight);
  svg.innerHTML=h;
}

function painel(t){
  const el=$('det');
  if(!t){
    el.innerHTML=`<h3>Detalhes da tarefa</h3><div class="ajuda">`+
      `<p><b>Passe o mouse</b> sobre uma tarefa para ver os detalhes aqui. <b>Clique</b> para fixar.</p>`+
      `<p>As setas ligam cada tarefa à próxima. A tarefa escolhida fica marcada em preto; a que vem antes, em azul; a que vem depois, em laranja.</p>`+
      `<p>Clique numa linha do comparativo (abaixo do gráfico) para destacar uma etapa inteira.</p></div>`;
    return;
  }
  const chip={ref:['s-ref','Prazo ideal (referência)'],marco:['s-todo','Marco previsto'],done:['s-done','Concluída'],doing:['s-doing','Em andamento'],todo:['s-todo','A iniciar (previsão)']}[t.st];
  let h=`<span class="chip ${chip[0]}">${chip[1]}</span>${t.critica?'<span class="chip crit">Caminho crítico</span>':''}<h3>${esc(t.nome)}</h3>`;
  h+=`<div class="l"><span>Período</span><b>${fmt(t.ini)}${t.dur?' → '+fmt(t.fim):''}</b>${t.dur?' · '+t.dur+' '+un():' · marco'}</div>`;
  if(t.responsavel)h+=`<div class="l"><span>Responsável</span>${esc(t.responsavel)}</div>`;
  if(!t.ref&&t.dur){
    h+=`<div class="l"><span>Andamento</span>${t.pr}% concluído<div class="pb"><i style="width:${t.pr}%"></i></div></div>`;
    if(t.pr<100)h+=`<div class="l"><span>Folga</span>${t.folga} dia(s)${t.critica?' — qualquer atraso empurra o fim':''}</div>`;
  }
  if(t.dep.length)h+=`<div class="l"><span>Depende de</span>${t.dep.map(d=>`<button class="lk" data-go="${esc(d)}">${esc(d)}. ${esc(byId[d].nome)}</button>`).join('')}</div>`;
  if(t.libera.length)h+=`<div class="l"><span>Libera</span>${t.libera.map(x=>`<button class="lk px" data-go="${esc(x.id)}">${esc(x.id)}. ${esc(x.nome)}</button>`).join('')}</div>`;
  const e=ETAPAS[t.etapa];
  if(e&&t.etapa)h+=`<div class="et"><span style="color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em">Etapa: ${esc(t.etapa)}</span><div>Ideal termina em <b>${fmt(e.ideal.fim)}</b></div><div>Previsto termina em <b>${fmt(e.fim)}</b> <span class="dif">(${e.dif>0?'+':''}${e.dif} ${un()})</span></div></div>`;
  if(t.sob)h+=`<div class="l"><span>Atenção</span>A data da planilha começa ${t.sob} dia(s) antes do fim da tarefa anterior.</div>`;
  el.innerHTML=h;
}

function atualiza(){
  const a=hov||sel,t=a?byId[a]:null;
  const ant=new Set(t?t.dep:[]),prox=new Set(t?t.libera.map(x=>x.id):[]);
  const et=etHov||etFixa;
  document.querySelectorAll('#chart .row[data-id]').forEach(r=>{
    const id=r.dataset.id;
    r.classList.toggle('foco',!!t&&id===t.id);
    r.classList.toggle('ant',ant.has(id));
    r.classList.toggle('prox',prox.has(id));
    r.classList.toggle('sel',id===sel);
    r.classList.toggle('et',!!et&&byId[id].etapa===et);
  });
  document.querySelectorAll('#lig .lk,#lig .ar').forEach(p=>p.classList.toggle('on',!!t&&(p.dataset.a===t.id||p.dataset.b===t.id)));
  document.querySelectorAll('#cmp tbody tr').forEach(tr=>tr.classList.toggle('sel',tr.dataset.et===etFixa));
  painel(t);
}

function ligar(){
  const ch=$('chart'),cm=$('cmp');
  ch.addEventListener('pointerover',e=>{
    const r=e.target.closest('.row[data-id]');const id=r?r.dataset.id:null;
    if(id!==hov){hov=id;atualiza();}
  });
  ch.addEventListener('pointerleave',()=>{hov=null;atualiza();});
  ch.addEventListener('click',e=>{
    const r=e.target.closest('.row[data-id]');if(!r)return;
    sel=sel===r.dataset.id?null:r.dataset.id;atualiza();
  });
  ch.addEventListener('keydown',e=>{
    if((e.key==='Enter'||e.key===' ')&&e.target.matches('.row[data-id]')){e.preventDefault();e.target.click();}
  });
  ch.addEventListener('focusin',e=>{const r=e.target.closest('.row[data-id]');if(r){hov=r.dataset.id;atualiza();}});
  ch.addEventListener('focusout',()=>{hov=null;atualiza();});
  $('det').addEventListener('click',e=>{
    const b=e.target.closest('[data-go]');if(!b)return;
    sel=b.dataset.go;hov=null;atualiza();
    const r=document.querySelector('#chart .row[data-id="'+sel+'"]');
    if(r)r.scrollIntoView({block:'nearest',behavior:'smooth'});
  });
  cm.addEventListener('pointerover',e=>{const tr=e.target.closest('tbody tr');const v=tr?tr.dataset.et:null;if(v!==etHov){etHov=v;atualiza();}});
  cm.addEventListener('pointerleave',()=>{etHov=null;atualiza();});
  cm.addEventListener('click',e=>{
    const tr=e.target.closest('tbody tr');if(!tr)return;
    etFixa=etFixa===tr.dataset.et?null:tr.dataset.et;atualiza();
    if(etFixa)ch.scrollIntoView({behavior:'smooth',block:'nearest'});
  });
  cm.addEventListener('keydown',e=>{
    if((e.key==='Enter'||e.key===' ')&&e.target.matches('tbody tr')){e.preventDefault();e.target.click();}
  });
  document.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>{zoom=b.dataset.z;desenhar();});
  $('bCrit').onclick=e=>{soCrit=!soCrit;e.currentTarget.classList.toggle('on',soCrit);desenhar();};
  const bi=$('bIdeal');
  if(!T.some(t=>t.ref))bi.hidden=true;
  bi.onclick=e=>{
    semIdeal=!semIdeal;e.currentTarget.classList.toggle('on',semIdeal);
    e.currentTarget.textContent=semIdeal?'Mostrar prazo ideal':'Ocultar prazo ideal';desenhar();
  };
  let tm;addEventListener('resize',()=>{clearTimeout(tm);tm=setTimeout(desenhar,150);});
}

try{
  agendar();resumo();comparar();analise();desenhar();ligar();
}catch(e){
  $('erro').innerHTML='<div class="erro"><b>Não foi possível montar o cronograma:</b> '+esc(e.message)+'</div>';
}
})();
</script>

</body></html>
