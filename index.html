<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cronogramas · Grupo Gadens</title>
<style>
:root{
  --bg:#F2F2F2; --surface:#FFFFFF; --ink:#2B2B2B; --ink-soft:#58595B; --muted:#767171;
  --border:#D8D6D6; --accent:#C0272D; --accent-strong:#A81A1E; --accent-soft:#F6E4E4;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  color:var(--ink);background:var(--bg);position:relative;
}
/* foto da fachada, translúcida, atrás de tudo */
body::before{
  content:"";position:fixed;inset:0;z-index:-2;
  background:url("assets/fachada-gadens.jpg") center 72%/cover no-repeat;
  opacity:.2;
}
body::after{
  content:"";position:fixed;inset:0;z-index:-1;
  background:linear-gradient(180deg,rgba(242,242,242,.9) 0%,rgba(242,242,242,.55) 55%,rgba(242,242,242,.8) 100%);
}
.topo{height:6px;background:var(--accent)}
.wrap{max-width:980px;margin:0 auto;padding:36px 20px 56px}
.marca{display:flex;align-items:center;gap:16px}
.marca img{height:60px;width:auto;display:block}
.marca b{display:block;font-size:22px;letter-spacing:-.01em;line-height:1.1}
.marca span{display:block;color:var(--ink-soft);font-size:13px;margin-top:2px}
h1{font-size:clamp(30px,5vw,46px);line-height:1.05;letter-spacing:-.025em;margin:44px 0 10px}
h1 em{font-style:normal;color:var(--accent)}
.lead{color:var(--ink-soft);font-size:17px;line-height:1.5;margin:0 0 30px;max-width:56ch}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.card{
  position:relative;display:flex;flex-direction:column;gap:10px;min-height:190px;
  padding:24px 24px 22px;border-radius:12px;text-decoration:none;color:inherit;
  background:rgba(255,255,255,.94);border:1px solid var(--border);border-top:5px solid var(--accent);
  box-shadow:0 2px 10px rgba(0,0,0,.06);transition:transform .15s,box-shadow .15s;
}
a.card:hover,a.card:focus-visible{transform:translateY(-3px);box-shadow:0 10px 26px rgba(0,0,0,.14);outline:none}
a.card:focus-visible{box-shadow:0 0 0 3px var(--accent-soft),0 10px 26px rgba(0,0,0,.14)}
.num{
  width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;
}
.card h2{margin:6px 0 0;font-size:30px;letter-spacing:-.02em}
.card p{margin:0;color:var(--ink-soft);font-size:15px;line-height:1.45}
.go{margin-top:auto;font-weight:600;color:var(--accent-strong);font-size:15px}
.card.off{border-top-color:var(--border);background:rgba(255,255,255,.7);border-style:dashed;border-top-style:solid;cursor:default;box-shadow:none}
.card.off .num{background:var(--muted)}
.card.off h2,.card.off p{color:var(--muted)}
.card.off .go{color:var(--muted);font-weight:500}
.rodape{margin-top:40px;color:var(--muted);font-size:12.5px}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<div class="topo"></div>
<main class="wrap">
  <div class="marca">
    <img src="assets/logo-gg.png" alt="Grupo Gadens">
    <div><b>Grupo Gadens</b><span>Cronogramas</span></div>
  </div>

  <h1>Escolha o <em>caminho</em></h1>
  <p class="lead">Selecione a empresa para ver os cronogramas dos projetos.</p>

  <div class="cards">
    <div class="card off" aria-disabled="true">
      <div class="num">1</div>
      <h2>Gadens</h2>
      <p>Nenhum cronograma publicado ainda.</p>
      <div class="go">Em breve</div>
    </div>

    <a class="card" href="make-it/">
      <div class="num">2</div>
      <h2>Make It</h2>
      <p>2 cronogramas: Horizon e Now, financiamento CEF.</p>
      <div class="go">Abrir &rarr;</div>
    </a>
  </div>

  <div class="rodape">Grupo Gadens &middot; posição dos cronogramas em 15/10/2026</div>
</main>
</body>
</html>
